{
  # Secrets sign the session cookie. Set GLUCOGLU_SECRET in production.
  secrets   => [$ENV{GLUCOGLU_SECRET} || 'glucoglu-dev-secret-change-me'],
  db        => {dsn => $ENV{GLUCOGLU_DB_DSN} || 'postgresql://glucoglu:glucoglu@localhost/glucoglu'},
  base_url  => $ENV{GLUCOGLU_URL} || 'http://localhost:3000',
  mail      => {
    # SMTP relay for login mails. Credentials from environment.
    host => $ENV{GLUCOGLU_SMTP_HOST} || '127.0.0.1',
    port => $ENV{GLUCOGLU_SMTP_PORT} || 587,
    user => $ENV{GLUCOGLU_SMTP_USER} || '',
    pass => $ENV{GLUCOGLU_SMTP_PASS} || '',
    from => $ENV{GLUCOGLU_SMTP_FROM} || 'glucoglu@localhost',
  },
}
# Glucoglu behind Apache: Apache owns TLS, hypnotoad serves 127.0.0.1:3000.
# Replace app.example.org with your domain everywhere below.
# Enable once: a2enmod proxy proxy_http headers
<VirtualHost *:443>
    ServerName app.example.org

    # TLS: get a cert for your domain (e.g. certbot --apache)
    SSLEngine on
    SSLCertificateFile  /etc/letsencrypt/live/app.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/app.example.org/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
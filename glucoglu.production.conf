{
  # A front-end proxy (e.g. Apache) owns TLS on 443 and proxies to us.
  # proxy => 1 makes the app trust Apache's X-Forwarded-* headers.
  # Vhost example: deploy/glucoglu.apache.conf
  hypnotoad => {
    listen  => ['http://127.0.0.1:3000'],
    workers => 2,
    proxy   => 1,
  },
}